# Redox reads $REDOX_CONFIG, then $XDG_CONFIG_HOME/redox/config.toml, then
# ~/.config/redox/config.toml. Every setting is optional.
# Run `:config reload` after saving to apply changes without restarting Redox.

theme = "default"
background_dimming = 0.5 # 0.0 disables popup background dimming; 1.0 is fully dimmed
undo_tree_history_size = 1000
color_column = 79 # Renders on top of cl=80
leader = " "

[popups.finder]
width_percent = 65
height_percent = 60
min_width = 52
min_height = 14

[popups.explorer]
width_percent = 65
height_percent = 60

# Other popup names: about, command_line, diagnostics, code_actions,
# lsp_marketplace, perf, and undo_tree.

[keybindings.normal]
open_finder = "<leader><leader>"
open_explorer = "<leader>e"
toggle_undo_tree = "<leader>u"
toggle_diagnostics = "<leader>x"
code_actions = "<leader>ca"
goto_definition = "gd"
close_split = "<ctrl-w>"

[keybindings.insert]
completion = "<ctrl-shift-k>"

[keybindings.visual]
yank_system = "<leader>y"

# Available actions include open_explorer, toggle_undo_tree, open_finder,
# toggle_diagnostics, code_actions, goto_definition, symbol_info, completion,
# undo, redo, movement and insert actions, clipboard operations, splits and
# focus, popup navigation, and surface navigation. Unknown action names are
# rejected at startup instead of being silently ignored.

# Define any number of named themes, then select one with `theme` above. A
