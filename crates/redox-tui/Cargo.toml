[package]
name = "redox-tui"
version = "0.3.2"
edition = "2024"
description = "TUI frontend runtime for redox-editor"
license = "MIT"
repository = "https://github.com/JackDerksen/redox"
readme = "README.md"
keywords = ["editor", "tui", "terminal", "vim", "text"]
categories = ["command-line-utilities", "text-editors"]

[[bin]]
name = "redox"
path = "src/main.rs"

[dependencies]
redox-core = { version = "0.3.0", path = "../redox-core" }
minui = { version = "0.6.5", features = ["clipboard"] }
anyhow = { workspace = true }
unicode-segmentation = "1.11.0"
tree-sitter = "0.26.7"
tree-sitter-rust = "0.24.0"
