[package]
name = "redox-tui"
version = "0.8.1"
edition = "2024"
description = "TUI frontend runtime for redox-editor"
license = "MIT"
repository = "https://github.com/JackDerksen/redox"
readme = "README.md"
keywords = ["editor", "tui", "terminal", "vim", "text"]
categories = ["command-line-utilities", "text-editors"]

[[bin]]
name = "redox"
path = "src/main.rs"

[dependencies]
redox-core = { version = "0.8.0", path = "../redox-core" }
redox-lsp = { version = "0.1.0", path = "../redox-lsp" }
minui = { version = "0.7.4", features = ["clipboard"] }
anyhow = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"
tempfile = "3.27.0"
rustix = { version = "1.1.4", features = ["fs"] }
unicode-segmentation = "1.13.3"
tree-sitter = "0.27.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-lua = "0.5.0"
tree-sitter-md = "0.5.3"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
ignore = "0.4.33"
regex = "1.13.1"
