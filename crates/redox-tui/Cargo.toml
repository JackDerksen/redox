[package]
name = "redox-tui"
version = "0.1.1"
edition = "2024"
description = "TUI frontend runtime for redox-editor"
license = "MIT"
readme = "README.md"
keywords = ["editor", "tui", "terminal", "vim", "text"]
categories = ["command-line-utilities", "text-editors"]

[[bin]]
name = "redox"
path = "src/main.rs"

[dependencies]
redox-core = { version = "0.1.0", path = "../redox-core" }
minui = { version = "0.6.4", features = ["clipboard"] }
anyhow = { workspace = true }
unicode-segmentation = "1.11.0"
